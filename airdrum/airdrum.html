<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Batería de Aire · Tóbal Blu</title>
<style>
  :root{
    --azul:#0E2439; --musgo:#2E4A38; --crema:#F5EDDC;
    --ambar:#B67B3A; --cobre:#8C4A2A; --azul2:#16324f; --linea:rgba(245,237,220,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 800px at 70% -10%, var(--azul2), var(--azul) 60%);
    color:var(--crema); font-family:"Helvetica Neue",Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased}
  header{padding:14px 20px; border-bottom:1px solid var(--linea); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  header h1{margin:0; font-size:18px; letter-spacing:.5px; font-weight:700}
  header h1 span{color:var(--ambar)}
  header .sub{font-size:12px; opacity:.6}
  .wrap{display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px; align-items:start}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr} }
  .stage{position:relative; background:#000; border:1px solid var(--linea); border-radius:14px; overflow:hidden; aspect-ratio:4/3}
  video{display:none}
  canvas{display:block; width:100%; height:100%}

  .wizard{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:20px; padding:24px; pointer-events:none}
  .wizard::before{content:""; position:absolute; inset:0;
    background:radial-gradient(65% 60% at 50% 46%, rgba(14,36,57,.55), rgba(14,36,57,.04) 72%)}
  .wiz-step{position:relative; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--ambar); opacity:.9}
  .wiz-big{position:relative; font-size:clamp(30px,6vw,66px); font-weight:800; letter-spacing:1px; color:var(--crema);
    text-shadow:0 4px 26px rgba(0,0,0,.65); line-height:1.05}
  .wiz-sub{position:relative; font-size:clamp(15px,2.3vw,22px); color:var(--crema); opacity:.9; max-width:640px;
    text-shadow:0 2px 14px rgba(0,0,0,.75)}
  .wiz-count{position:relative; font-size:clamp(90px,22vw,220px); font-weight:800; color:var(--ambar);
    text-shadow:0 8px 44px rgba(0,0,0,.6)}
  .wiz-actions{position:relative; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; pointer-events:auto}
  .wiz-actions button{font-size:16px; padding:12px 22px}
  .wizbar{position:relative; width:min(420px,70%); height:9px; background:rgba(245,237,220,.2); border-radius:6px; overflow:hidden}
  .wizbar-fill{height:100%; width:100%; background:var(--ambar); transition:width .05s linear}
  .wiz-slider{position:relative; width:min(460px,80%); pointer-events:auto}
  .wiz-slider input{width:100%}
  .wiz-slider .lab{font-size:13px; opacity:.85; margin-bottom:6px}

  .panel{background:rgba(14,36,57,.6); border:1px solid var(--linea); border-radius:14px; padding:14px; margin-bottom:14px}
  .panel h2{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--ambar)}
  button{font:inherit; color:var(--crema); background:var(--cobre); border:none; padding:9px 12px; border-radius:9px; cursor:pointer; font-size:13px}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:transparent; border:1px solid var(--linea)}
  button.amber{background:var(--ambar); color:var(--azul); font-weight:700}
  button:disabled{opacity:.4; cursor:not-allowed}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
  label.small{font-size:12px; opacity:.8}
  input[type=range]{width:100%}
  input[type=number]{width:64px; background:#0a1a2b; color:var(--crema); border:1px solid var(--linea); border-radius:6px; padding:4px}
  .pad-list{display:flex; flex-direction:column; gap:6px}
  .pad{display:grid; grid-template-columns:14px 1fr auto; gap:8px; align-items:center; padding:8px; border:1px solid var(--linea); border-radius:9px; background:rgba(0,0,0,.15)}
  .pad.sel{border-color:var(--ambar)}
  .dot{width:12px;height:12px;border-radius:50%}
  .pad .name{font-size:13px; font-weight:600}
  .pad .meta{font-size:11px; opacity:.6}
  input[type=file]{font-size:11px; color:var(--crema); max-width:150px}
  .status{font-size:12px; padding:8px 10px; border-radius:8px; background:rgba(0,0,0,.25); border:1px solid var(--linea); min-height:18px}
  .status.err{border-color:var(--cobre); color:#ffd7c2}
  .status.ok{border-color:var(--musgo)}
  a{color:var(--ambar)}
</style>
</head>
<body>
<header>
  <h1>Batería de <span>Aire</span></h1>
  <span class="sub">Tóbal Blu · toca el beat con tu cámara</span>
</header>

<div class="wrap">
  <div>
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="wizard" id="wizard"></div>
    </div>
    <div class="status" id="status" style="margin-top:12px">Listo para empezar.</div>
  </div>

  <div>
    <div class="panel">
      <h2>Sensibilidad</h2>
      <label class="small">Manos</label>
      <input type="range" id="sensHands" min="0.6" max="3.5" step="0.05" value="1.5">
      <label class="small">Pierna (kick)</label>
      <input type="range" id="sensFeet" min="0.2" max="2" step="0.02" value="0.6">
    </div>

    <div class="panel">
      <h2>Samples</h2>
      <div class="pad-list" id="padList"></div>
      <div class="row" style="margin-top:10px"><label class="small">Radio del pad seleccionado</label></div>
      <input type="range" id="radius" min="0.04" max="0.20" step="0.005" value="0.09">
      <div class="row" style="margin-top:10px"><button id="btnRecalib" class="ghost">Calibrar de nuevo</button></div>
    </div>

    <div class="panel">
      <h2>Tiempo y pista</h2>
      <div class="row">
        <label class="small">BPM</label>
        <input type="number" id="bpm" value="100" min="40" max="240">
        <button id="btnMetro" class="ghost">Metrónomo</button>
      </div>
      <div class="row"><label class="small">Pista base:</label><input type="file" id="backingFile" accept="audio/*"></div>
      <div class="row">
        <button id="btnPlay" class="ghost" disabled>Reproducir pista (con conteo)</button>
        <button id="btnStop" class="ghost">Parar</button>
      </div>
    </div>

    <div class="panel">
      <h2>Grabar (opcional)</h2>
      <div class="row">
        <button id="btnRec" class="ghost">● Grabar audio</button>
        <span id="recTag" style="display:none;font-size:10px;padding:2px 6px;border-radius:5px;background:var(--cobre)">REC</span>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const statusEl = $("status");
function setStatus(m,c=""){ statusEl.textContent=m; statusEl.className="status "+c; }

let audioCtx, masterGain, musicGain, clickGain, mediaDest;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); musicGain=audioCtx.createGain();
  clickGain=audioCtx.createGain(); clickGain.gain.value=.5;
  mediaDest=audioCtx.createMediaStreamDestination();
  masterGain.connect(audioCtx.destination);
  musicGain.connect(masterGain); musicGain.connect(mediaDest);
  clickGain.connect(audioCtx.destination);
}
function playBuffer(b){ const s=audioCtx.createBufferSource(); s.buffer=b; s.connect(musicGain); s.start(); }
async function fileToBuffer(f){ return await audioCtx.decodeAudioData(await f.arrayBuffer()); }

const pads=[
  {id:"kick", name:"Kick",        role:"kick",  x:.5,  y:.9,  r:.10, color:"#e0863c", src:"sonidos/kick.wav",     buffer:null, flash:0, lastHit:0, hidden:true},
  {id:"snare",name:"Snare",       role:"snare", x:.44, y:.66, r:.10, color:"#F5EDDC", src:"sonidos/snare.wav",    buffer:null, flash:0, lastHit:0},
  {id:"hh",   name:"Hi-Hat",      role:"hihat", x:.28, y:.45, r:.09, color:"#B67B3A", src:"sonidos/hihat.wav",    buffer:null, flash:0, lastHit:0},
  {id:"tom",  name:"Tom",         role:"tom",   x:.56, y:.42, r:.09, color:"#8C4A2A", src:"sonidos/tom.wav",      buffer:null, flash:0, lastHit:0},
  {id:"floor",name:"Tom de piso", role:"floor", x:.72, y:.55, r:.10, color:"#2E4A38", src:"sonidos/tom-piso.wav", buffer:null, flash:0, lastHit:0},
];
const DRUMS={
  kick:{name:"Kick",        type:"leg",  hint:"Rebota la rodilla (súbela y bájala rápido) para sonar el kick."},
  snare:{name:"Snare",      type:"hand", hint:"Pégale al lugar donde va el snare."},
  hh:{name:"Hi-Hat",        type:"hand", hint:"Pégale al lugar donde va el hi-hat."},
  tom:{name:"Tom",          type:"hand", hint:"Pégale al lugar donde va el tom."},
  floor:{name:"Tom de piso",type:"hand", hint:"Pégale al lugar donde va el tom de piso."},
};
let selectedPadId="snare", learnPadId=null;

function renderPadList(){
  const list=$("padList"); list.innerHTML="";
  pads.forEach(p=>{
    const row=document.createElement("div");
    row.className="pad"+(p.id===selectedPadId?" sel":"");
    row.innerHTML=`
      <span class="dot" style="background:${p.color}"></span>
      <span><span class="name">${p.name}</span>
        <span class="meta">${p.buffer?"sample ✓":"sin sample"}</span></span>
      <label style="padding:5px 7px;border:1px solid var(--linea);border-radius:8px;cursor:pointer;font-size:11px">
        Archivo<input type="file" accept="audio/*" data-file="${p.id}" style="display:none"></label>`;
    row.addEventListener("click",e=>{ if(e.target.dataset.file) return;
      selectedPadId=p.id; $("radius").value=p.r; renderPadList(); });
    list.appendChild(row);
  });
  list.querySelectorAll("[data-file]").forEach(inp=>inp.onchange=async e=>{
    initAudio(); const p=pads.find(p=>p.id===inp.dataset.file);
    try{ p.buffer=await fileToBuffer(e.target.files[0]); setStatus("Sample cargado en "+p.name,"ok"); renderPadList(); }
    catch(err){ setStatus("No pude leer ese audio: "+err.message,"err"); }
  });
}
renderPadList();
$("radius").addEventListener("input",e=>{ const p=pads.find(p=>p.id===selectedPadId); if(p) p.r=parseFloat(e.target.value); });

async function loadDefaults(){
  for(const p of pads){ if(!p.src) continue;
    try{ const r=await fetch(p.src); if(!r.ok) continue; p.buffer=await audioCtx.decodeAudioData(await r.arrayBuffer()); }catch(e){} }
  renderPadList();
  const n=pads.filter(p=>p.buffer).length; if(n>0) setStatus(n+" samples cargados desde /sonidos.","ok");
}
window.addEventListener("load",()=>{ initAudio(); loadDefaults(); renderWizard(); });

const video=$("video"), canvas=$("canvas"), ctx=canvas.getContext("2d");
let handLandmarker=null, poseLandmarker=null, running=false, lastVideoTime=-1, frameCount=0;

async function startCamera(){
  initAudio(); if(audioCtx.state==="suspended") await audioCtx.resume();
  if(!window.isSecureContext){ setStatus("La cámara necesita HTTPS. Súbela a GitHub Pages y ábrela desde ahí.","err");
    wiz.state="camera"; wiz.loading=false; renderWizard(); return; }
  wiz.loading=true; renderWizard(); setStatus("Cargando modelos de visión…");
  try{
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    handLandmarker=await HandLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO",numHands:2});
    poseLandmarker=await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
      runningMode:"VIDEO",numPoses:1});
  }catch(err){ setStatus("Fallo cargando modelos (¿sin internet?): "+err.message,"err"); wiz.loading=false; renderWizard(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:960,facingMode:"user"},audio:false}); }
  catch(err){ setStatus("No pude abrir la cámara: "+err.message,"err"); wiz.loading=false; renderWizard(); return; }
  video.srcObject=stream; await video.play();
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  running=true; requestAnimationFrame(loop);
  setStatus("Cámara lista.","ok");
  wiz.loading=false; wiz.idx=0; goPrep();
}

let handState={};
let legState={lY:null,rY:null,prevT:null,lastKick:0,dL:null,dR:null};
let kickFlash=0;
const sensHands=()=>parseFloat($("sensHands").value);
const sensLeg  =()=>parseFloat($("sensFeet").value);

function triggersEnabled(){ return ["capture","adjust","done","play"].includes(wiz.state); }

function fire(mx,my){
  if(learnPadId){ const p=pads.find(p=>p.id===learnPadId); p.x=mx; p.y=my; learnPadId=null;
    if(p.buffer) playBuffer(p.buffer); p.flash=1; return; }
  let best=null,bestD=Infinity;
  for(const p of pads){ if(p.hidden) continue;
    const dx=(mx-p.x)*canvas.width, dy=(my-p.y)*canvas.height, d=Math.hypot(dx,dy), rpx=p.r*canvas.width;
    if(d<rpx && d<bestD){ best=p; bestD=d; } }
  if(best) triggerPad(best);
}
function triggerPad(p){
  if(!triggersEnabled()) return;
  const now=performance.now(); if(now-p.lastHit<70) return; p.lastHit=now;
  if(p.buffer) playBuffer(p.buffer); p.flash=1;
}
function handleHands(res,now){
  if(!res||!res.landmarks) return;
  for(let i=0;i<res.landmarks.length;i++){
    const label=(res.handedness?.[i]?.[0]?.categoryName)||("h"+i);
    const lm=res.landmarks[i][9]; const y=lm.y, mx=1-lm.x, my=lm.y;
    let st=handState[label]||(handState[label]={prevY:y,prevT:now,armed:true});
    let dt=(now-st.prevT)/1000; if(dt<=0) dt=.016;
    const vy=(y-st.prevY)/dt, thr=sensHands();
    if(st.armed && vy>thr){ fire(mx,my); st.armed=false; }
    if(vy<thr*.25) st.armed=true;
    st.prevY=y; st.prevT=now; st._draw={x:mx*canvas.width,y:my*canvas.height};
  }
}
function handleLegs(res,now){
  if(!res||!res.landmarks||!res.landmarks[0]) return;
  const lms=res.landmarks[0], kL=lms[25], kR=lms[26];
  if(legState.prevT!=null){
    let dt=(now-legState.prevT)/1000; if(dt<=0) dt=.016;
    const vL=kL&&legState.lY!=null?Math.abs((kL.y-legState.lY)/dt):0;
    const vR=kR&&legState.rY!=null?Math.abs((kR.y-legState.rY)/dt):0;
    if(Math.max(vL,vR)>sensLeg() && now-legState.lastKick>200){
      const kp=pads.find(p=>p.role==="kick"); if(kp){ triggerPad(kp); if(triggersEnabled()) kickFlash=1; } legState.lastKick=now;
    }
  }
  if(kL){ legState.lY=kL.y; legState.dL={x:(1-kL.x)*canvas.width,y:kL.y*canvas.height}; }
  if(kR){ legState.rY=kR.y; legState.dR={x:(1-kR.x)*canvas.width,y:kR.y*canvas.height}; }
  legState.prevT=now;
}

function loop(){
  if(!running) return; frameCount++; const now=performance.now();
  if(video.currentTime!==lastVideoTime){ lastVideoTime=video.currentTime;
    try{ handleHands(handLandmarker.detectForVideo(video,now),now);
      if(frameCount%2===0) handleLegs(poseLandmarker.detectForVideo(video,now+.5),now); }catch(e){} }
  draw(); requestAnimationFrame(loop);
}
function draw(){
  const w=canvas.width,h=canvas.height;
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-w,0,w,h); ctx.restore();
  ctx.fillStyle="rgba(14,36,57,.18)"; ctx.fillRect(0,0,w,h);
  for(const p of pads){ if(p.hidden) continue;
    const cx=p.x*w,cy=p.y*h,r=p.r*w;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.lineWidth=p.id===selectedPadId?5:3; ctx.strokeStyle=p.color; ctx.globalAlpha=.9; ctx.stroke();
    if(p.flash>0){ ctx.globalAlpha=p.flash*.5; ctx.fillStyle=p.color; ctx.fill(); p.flash*=.82; }
    ctx.globalAlpha=1; ctx.fillStyle="#F5EDDC"; ctx.font="600 15px Helvetica,sans-serif"; ctx.textAlign="center";
    ctx.fillText(p.name,cx,cy-r-8);
  }
  for(const k in handState){ const d=handState[k]._draw; if(!d) continue;
    ctx.beginPath(); ctx.arc(d.x,d.y,10,0,Math.PI*2); ctx.fillStyle="#F5EDDC"; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="#B67B3A"; ctx.stroke(); }
  for(const d of [legState.dL,legState.dR]){ if(!d) continue;
    ctx.beginPath(); ctx.arc(d.x,d.y,9,0,Math.PI*2); ctx.globalAlpha=.85; ctx.fillStyle="#e0863c"; ctx.fill(); ctx.globalAlpha=1; }
  if(kickFlash>0){ ctx.globalAlpha=kickFlash*.55; ctx.fillStyle="#e0863c";
    ctx.beginPath(); ctx.arc(w/2,h-34,24+(1-kickFlash)*30,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; kickFlash*=.85; }
}

const wiz={ order:["kick","snare","hh","tom","floor"], idx:0, state:"camera", loading:false, count:3, timer:null, captureEnd:0 };
const curId=()=>wiz.order[wiz.idx];
function clearTimer(){ if(wiz.timer){ clearInterval(wiz.timer); wiz.timer=null; } }

function goPrep(){ clearTimer(); wiz.state="prep"; selectedPadId=curId(); renderPadList(); renderWizard(); }
function beginCountdown(){
  clearTimer(); wiz.state="countdown"; wiz.count=3; renderWizard();
  wiz.timer=setInterval(()=>{ wiz.count--;
    if(wiz.count<=0){ clearTimer(); startCapture(); } else renderWizard(); },1000);
}
function startCapture(){
  clearTimer(); wiz.state="capture";
  const d=DRUMS[curId()]; if(d.type==="hand") learnPadId=curId();
  wiz.captureEnd=performance.now()+4000; renderWizard();
  wiz.timer=setInterval(()=>{ const rem=wiz.captureEnd-performance.now();
    if(rem<=0){ clearTimer(); learnPadId=null; wiz.state="adjust"; renderWizard(); }
    else{ const el=document.getElementById("wizbarFill"); if(el) el.style.width=(rem/4000*100)+"%"; } },40);
}
function nextDrum(){ clearTimer(); wiz.idx++; if(wiz.idx>=wiz.order.length){ wiz.state="done"; renderWizard(); } else goPrep(); }

function renderWizard(){
  const el=$("wizard");
  if(wiz.state==="play"){ el.style.display="none"; return; }
  el.style.display="flex";
  const d=DRUMS[curId()]; const isLeg=d&&d.type==="leg";
  let html="";
  if(wiz.state==="camera"){
    html=`<div class="wiz-step">Paso 1</div>
      <div class="wiz-big">Activa la cámara</div>
      <div class="wiz-sub">Presiona el botón y luego <b>Permitir</b> el acceso a la cámara.</div>
      <div class="wiz-actions"><button class="amber" id="wCam" ${wiz.loading?"disabled":""}>${wiz.loading?"Cargando…":"Iniciar cámara"}</button></div>`;
  } else if(wiz.state==="prep"){
    html=`<div class="wiz-step">Paso 2 · ${d.name}</div>
      <div class="wiz-big">Configura el ${d.name}</div>
      <div class="wiz-sub">${d.hint}<br>Cuando estés listo, presiona <b>Empezar</b>: cuenta 3 y tienes 4 segundos.</div>
      <div class="wiz-actions"><button class="amber" id="wGo">Empezar</button></div>`;
  } else if(wiz.state==="countdown"){
    html=`<div class="wiz-step">${d.name}</div><div class="wiz-count">${wiz.count}</div>`;
  } else if(wiz.state==="capture"){
    html=`<div class="wiz-step">${d.name} · ¡grabando movimiento!</div>
      <div class="wiz-big">${isLeg?"¡Rebota la rodilla!":"¡Pégale al "+d.name+"!"}</div>
      <div class="wiz-sub">${isLeg?"Marca el pulso; escucha que el kick suene bien.":"Fija el lugar y escucha el golpe."}</div>
      <div class="wizbar"><div class="wizbar-fill" id="wizbarFill"></div></div>`;
  } else if(wiz.state==="adjust"){
    const last=wiz.idx===wiz.order.length-1;
    const nextName=last?"":DRUMS[wiz.order[wiz.idx+1]].name;
    const sl=isLeg
      ? `<div class="lab">Sensibilidad pierna (kick)</div><input type="range" id="wizSens" min="0.2" max="2" step="0.02" value="${sensLeg()}">`
      : `<div class="lab">Sensibilidad manos</div><input type="range" id="wizSens" min="0.6" max="3.5" step="0.05" value="${sensHands()}">`;
    html=`<div class="wiz-step">Paso 3 · ${d.name}</div>
      <div class="wiz-big">¿Suena bien?</div>
      <div class="wiz-sub">${isLeg?"Rebota la rodilla":"Golpea el "+d.name} y ajusta hasta quedar conforme.</div>
      <div class="wiz-slider">${sl}</div>
      <div class="wiz-actions">
        <button class="ghost" id="wRe">Recalibrar ${d.name}</button>
        <button class="amber" id="wNext">${last?"Terminar":"Continuar con "+nextName}</button>
      </div>`;
  } else if(wiz.state==="done"){
    html=`<div class="wiz-step">Listo</div>
      <div class="wiz-big">¡A tocar!</div>
      <div class="wiz-sub">Ya está todo calibrado. Usa el metrónomo o carga tu pista base y toca encima.</div>
      <div class="wiz-actions">
        <button class="ghost" id="wReAll">Calibrar de nuevo</button>
        <button class="amber" id="wClose">Cerrar</button>
      </div>`;
  }
  el.innerHTML=html;
  const b=id=>document.getElementById(id);
  if(b("wCam")) b("wCam").onclick=startCamera;
  if(b("wGo")) b("wGo").onclick=beginCountdown;
  if(b("wRe")) b("wRe").onclick=goPrep;
  if(b("wNext")) b("wNext").onclick=nextDrum;
  if(b("wReAll")) b("wReAll").onclick=()=>{ wiz.idx=0; goPrep(); };
  if(b("wClose")) b("wClose").onclick=()=>{ wiz.state="play"; renderWizard(); };
  if(b("wizSens")) b("wizSens").oninput=e=>{ (isLeg?$("sensFeet"):$("sensHands")).value=e.target.value; };
}

$("btnRecalib").onclick=()=>{ wiz.idx=0; if(running) goPrep(); else { wiz.state="camera"; renderWizard(); } };

let metroTimer=null, metroNext=0, metroBeat=0;
function playClick(t,accent){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=accent?1600:950; o.connect(g); g.connect(clickGain);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.7,t+.001); g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.start(t); o.stop(t+.06);
}
$("btnMetro").onclick=()=>{
  initAudio(); if(audioCtx.state==="suspended") audioCtx.resume();
  if(metroTimer){ clearInterval(metroTimer); metroTimer=null; $("btnMetro").classList.remove("amber"); return; }
  metroNext=audioCtx.currentTime+.1; metroBeat=0;
  metroTimer=setInterval(()=>{ const spb=60/(+$("bpm").value);
    while(metroNext<audioCtx.currentTime+.12){ playClick(metroNext,metroBeat%4===0); metroNext+=spb; metroBeat++; } },25);
  $("btnMetro").classList.add("amber");
};
let backingBuffer=null, backingSource=null;
$("backingFile").onchange=async e=>{ initAudio();
  try{ backingBuffer=await fileToBuffer(e.target.files[0]); $("btnPlay").disabled=false; setStatus("Pista base cargada.","ok"); }
  catch(err){ setStatus("No pude leer la pista: "+err.message,"err"); } };
$("btnPlay").onclick=()=>{
  if(!backingBuffer) return; initAudio(); if(audioCtx.state==="suspended") audioCtx.resume();
  const spb=60/(+$("bpm").value), start=audioCtx.currentTime+.15;
  for(let i=0;i<4;i++) playClick(start+i*spb,i===0);
  backingSource=audioCtx.createBufferSource(); backingSource.buffer=backingBuffer; backingSource.connect(musicGain);
  backingSource.start(start+4*spb); setStatus("Conteo… ¡y a tocar encima!","ok");
};
$("btnStop").onclick=()=>{ if(backingSource){ try{backingSource.stop()}catch(e){} backingSource=null; } };

let recorder=null, recChunks=[];
$("btnRec").onclick=()=>{
  initAudio(); if(recorder&&recorder.state==="recording"){ recorder.stop(); return; }
  recChunks=[]; recorder=new MediaRecorder(mediaDest.stream);
  recorder.ondataavailable=e=>recChunks.push(e.data);
  recorder.onstop=()=>{ const blob=new Blob(recChunks,{type:"audio/webm"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="airdrum.webm"; a.click();
    $("recTag").style.display="none"; $("btnRec").classList.remove("amber"); setStatus("Audio grabado descargado.","ok"); };
  recorder.start(); $("recTag").style.display="inline-block"; $("btnRec").classList.add("amber"); setStatus("Grabando…","ok");
};
</script>
