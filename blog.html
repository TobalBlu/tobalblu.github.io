<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Tobal Blu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --papel: #f4efe6;
      --tinta: #2b2721;
      --tinta-suave: #6f675b;
      --tinta-tenue: #a89f90;
      --linea: #ddd4c4;
      --carta: #fbf7ee;
    }

    body {
      background: var(--papel);
      color: var(--tinta);
      font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    .home-link {
      position: fixed; top: 1.6rem; left: 1.6rem;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--tinta-suave); text-decoration: none;
      transition: color 0.3s; z-index: 10;
    }
    .home-link:hover { color: var(--tinta); }

    .wrap { max-width: 640px; margin: 0 auto; padding: 6rem 1.5rem 5rem; }

    .blog-titulo {
      font-size: 13px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--tinta-suave); margin-bottom: 0.6rem; text-align: center;
      font-weight: 400;
    }
    .blog-intro {
      font-size: 13px; font-style: italic; color: var(--tinta-tenue);
      text-align: center; margin-bottom: 3.5rem;
    }

    /* ===== CARTAS (lista) ===== */
    .cartas { display: flex; flex-direction: column; gap: 1.4rem; }
    .cartas.oculto { display: none; }

    .carta {
      position: relative;
      background: var(--carta);
      border: 1px solid var(--linea);
      padding: 1.6rem 1.7rem;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    /* solapa de sobre: una línea diagonal sutil arriba, como carta doblada */
    .carta::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 44px;
      background: linear-gradient(180deg, rgba(221,212,196,0.35), transparent);
      pointer-events: none;
      opacity: 0.8;
      transition: opacity 0.35s ease;
    }
    .carta:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(43,39,33,0.13);
      border-color: var(--tinta-tenue);
    }
    .carta:hover::before { opacity: 0; }

    .carta-titulo {
      font-size: 20px; color: var(--tinta); letter-spacing: 0.01em;
      line-height: 1.35; margin-bottom: 0.25rem;
      transition: color 0.3s ease;
    }
    .carta-fecha {
      font-size: 12px; font-style: italic; color: var(--tinta-suave);
    }

    /* el cuerpo que se despliega al pasar el mouse */
    .carta-despliegue {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s ease, opacity 0.4s ease, margin-top 0.4s ease;
      margin-top: 0;
    }
    .carta:hover .carta-despliegue,
    .carta.abierta-preview .carta-despliegue {
      max-height: 160px;
      opacity: 1;
      margin-top: 1rem;
    }

    .carta-extracto {
      font-size: 14px; line-height: 1.7; color: var(--tinta-suave);
    }
    .carta-leer {
      display: inline-block; margin-top: 0.9rem;
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--tinta);
    }
    .carta-leer .flecha { transition: transform 0.3s ease; display: inline-block; }
    .carta:hover .carta-leer .flecha { transform: translateX(4px); }

    .vacio { font-size: 14px; color: var(--tinta-suave); padding: 2rem 0; text-align: center; }

    /* ===== POST (lectura) ===== */
    .post-vista { display: none; }
    .post-vista.activo { display: block; }

    .volver {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--tinta-suave); cursor: pointer; transition: color 0.3s;
      margin-bottom: 3.5rem; display: inline-block;
    }
    .volver:hover { color: var(--tinta); }

    .post-titulo {
      font-size: 30px; color: var(--tinta); line-height: 1.3;
      text-align: center; margin-bottom: 0.8rem; font-weight: 700;
      letter-spacing: 0.01em;
    }
    .post-sub {
      font-size: 14px; color: var(--tinta-suave); font-style: italic;
      text-align: center; margin-bottom: 3.5rem;
    }
    .ornamento {
      text-align: center; color: var(--tinta-tenue);
      font-size: 14px; letter-spacing: 0.5em; margin-bottom: 3rem;
    }
    .post-cuerpo { font-size: 17px; color: var(--tinta); }
    .post-cuerpo p { margin-bottom: 1.7rem; text-align: left; }
    .post-cuerpo p:last-child { margin-bottom: 0; }
    .post-cuerpo p.nota {
      font-size: 13.5px; font-style: italic; color: var(--tinta-suave);
      line-height: 1.7; margin-bottom: 0.8rem;
    }
    .notas-sep { width: 60px; height: 1px; background: var(--linea); margin: 2.5rem 0 1.8rem; }

    /* ===== OJO / LEÍDO ===== */
    .leido-zona {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 4rem; padding-top: 2.5rem; border-top: 1px solid var(--linea);
      position: relative;
    }
    .gracias-pop {
      position: absolute; top: 0.6rem; left: 50%;
      transform: translate(-50%, 0);
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: #dcf8c6; color: #3a5a3f;
      font-family: 'Libre Baskerville', serif; font-size: 12px; letter-spacing: 0.06em;
      padding: 0.5rem 0.85rem; border-radius: 14px 14px 14px 4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.10);
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    .gracias-pop.mostrar { animation: graciasFade 4s ease forwards; }
    @keyframes graciasFade { 0%{opacity:0;} 12%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
    .gracias-corazon { width: 14px; height: 14px; display: block; }
    .gracias-corazon path { fill: #4caf50; }

    .ojo-btn {
      display: inline-flex; flex-direction: column; align-items: center; gap: 0.6rem;
      background: none; border: none; cursor: pointer; user-select: none;
      font-family: 'Libre Baskerville', serif;
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--tinta-suave); transition: color 0.4s ease; padding: 0.4rem;
    }
    .ojo-btn:hover { color: var(--tinta); }
    .ojo-btn.confirmado { color: #3f7a52; cursor: default; }
    .ojo-icon { width: 26px; height: 26px; display: block; }
    .ojo-icon path, .ojo-icon circle {
      fill: none; stroke: var(--tinta-suave); stroke-width: 1.4;
      transition: stroke 0.4s ease, fill 0.4s ease;
    }
    .ojo-btn:hover .ojo-icon path, .ojo-btn:hover .ojo-icon circle { stroke: var(--tinta); }
    .ojo-btn.confirmado .ojo-icon path { stroke: #3f7a52; }
    .ojo-btn.confirmado .ojo-icon circle { stroke: #3f7a52; fill: #3f7a52; }

    /* En móvil no hay hover: el despliegue se muestra siempre, para que se vea que hay más */
    @media (hover: none) {
      .carta-despliegue { max-height: 160px; opacity: 1; margin-top: 1rem; }
      .carta::before { opacity: 0; }
    }
  </style>

</head>

/* ===== leído ===== */
function claveLeido(id){ return 'blog-leido-'+id; }
function estaLeido(id){ try { return localStorage.getItem(claveLeido(id))==='1'; } catch(e){ return false; } }
function marcarLocal(id){ try { localStorage.setItem(claveLeido(id),'1'); } catch(e){} }
function sumarLeido(id){ if(!sbClient) return; try { sbClient.from('lecturas').insert({post_id:id}).then(function(){}).catch(function(){}); } catch(e){} }

/* extracto para la carta: primeras palabras del cuerpo, sin notas */
function extracto(texto, max){
  var limpio = texto.split('\n').filter(function(l){ return l.trim() && l.trim().charAt(0)!=='*'; }).join(' ');
  limpio = limpio.replace(/\s+/g,' ').trim();
  if (limpio.length <= max) return limpio;
  return limpio.slice(0, max).replace(/\s+\S*$/,'') + '…';
}

/* ===== render cartas ===== */
function renderCartas(){
  var cont = document.getElementById('cartas');
  cont.innerHTML = '';
  if(!posts.length){ cont.innerHTML = '<div class="vacio">Aún no hay cartas.</div>'; return; }
  posts.forEach(function(p){
    var carta = document.createElement('div');
    carta.className = 'carta';

    var tit = document.createElement('div');
    tit.className = 'carta-titulo'; tit.textContent = p.titulo;

    var fec = document.createElement('div');
    fec.className = 'carta-fecha'; fec.textContent = p.subtitulo || '';

    var desp = document.createElement('div');
    desp.className = 'carta-despliegue';
    var ext = document.createElement('div');
    ext.className = 'carta-extracto'; ext.textContent = extracto(p.cuerpo, 130);
    var leer = document.createElement('span');
    leer.className = 'carta-leer';
    leer.innerHTML = 'leer carta <span class="flecha">→</span>';
    desp.appendChild(ext); desp.appendChild(leer);

    carta.appendChild(tit); carta.appendChild(fec); carta.appendChild(desp);
    carta.addEventListener('click', function(){ abrirPost(p); });
    cont.appendChild(carta);
  });
}

/* ===== abrir post ===== */
function abrirPost(p){
  document.getElementById('post-titulo').textContent = p.titulo;
  var subEl = document.getElementById('post-sub');
  if(p.subtitulo){ subEl.textContent = p.subtitulo; subEl.style.display=''; } else { subEl.style.display='none'; }

  var cont = document.getElementById('post-cuerpo'); cont.innerHTML='';
  var notasEmp = false;
  p.cuerpo.split('\n\n').forEach(function(bloque){
    if(bloque.replace(/\s/g,'')==='') return;
    var esNota = /^\s*\*/.test(bloque);
    if(esNota && !notasEmp){ var s=document.createElement('div'); s.className='notas-sep'; cont.appendChild(s); notasEmp=true; }
    var par=document.createElement('p'); if(esNota) par.className='nota';
    bloque.split('\n').forEach(function(l,i){ if(i>0) par.appendChild(document.createElement('br')); par.appendChild(document.createTextNode(l)); });
    cont.appendChild(par);
  });

  var btn=document.getElementById('ojo-btn'), label=document.getElementById('ojo-label');
  btn.classList.toggle('confirmado', estaLeido(p.id)); label.textContent='leído';
  btn.onclick=function(){ if(estaLeido(p.id)) return; marcarLocal(p.id); btn.classList.add('confirmado'); sumarLeido(p.id); mostrarGracias(); };

  document.getElementById('cartas').classList.add('oculto');
  document.querySelector('.blog-titulo').style.display='none';
  document.querySelector('.blog-intro').style.display='none';
  document.getElementById('post-vista').classList.add('activo');
  window.scrollTo(0,0);
}

function mostrarGracias(){
  var pop=document.getElementById('gracias-pop'); if(!pop) return;
  pop.classList.remove('mostrar'); void pop.offsetWidth; pop.classList.add('mostrar');
  setTimeout(function(){ pop.classList.remove('mostrar'); }, 4100);
}

document.getElementById('volver').addEventListener('click', function(){
  document.getElementById('post-vista').classList.remove('activo');
  document.getElementById('cartas').classList.remove('oculto');
  document.querySelector('.blog-titulo').style.display='';
  document.querySelector('.blog-intro').style.display='';
  window.scrollTo(0,0);
});

renderCartas();
</script>
