<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Tobal Blu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --papel: #f4efe6;
      --tinta: #2b2721;
      --tinta-suave: #6f675b;
      --tinta-tenue: #a89f90;
      --linea: #ddd4c4;
    }

    body {
      background: var(--papel);
      color: var(--tinta);
      font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    .home-link {
      position: fixed; top: 1.6rem; left: 1.6rem;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--tinta-tenue); text-decoration: none;
      transition: color 0.3s; z-index: 10;
      font-family: 'Libre Baskerville', serif;
    }
    .home-link:hover { color: var(--tinta); }

    .wrap { max-width: 640px; margin: 0 auto; padding: 6rem 1.5rem 5rem; }

    .blog-titulo {
      font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--tinta-suave); margin-bottom: 3.5rem; text-align: center;
      font-weight: 400;
    }

    .lista { display: block; }
    .lista.oculto { display: none; }

    .post-item {
      padding: 1.8rem 0; border-top: 1px solid var(--linea);
      cursor: pointer; text-align: center;
    }
    .post-item:last-child { border-bottom: 1px solid var(--linea); }

    .post-item-titulo {
      font-size: 19px; color: var(--tinta); letter-spacing: 0.01em;
      transition: opacity 0.3s ease;
    }
    .post-item:hover .post-item-titulo { opacity: 0.6; }
    .post-item-sub {
      font-size: 13px; color: var(--tinta-suave); font-style: italic;
      margin-top: 0.4rem;
    }

    .vacio { font-size: 14px; color: var(--tinta-suave); padding: 2rem 0; text-align: center; }

    .post-vista { display: none; }
    .post-vista.activo { display: block; }

    .volver {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--tinta-tenue); cursor: pointer; transition: color 0.3s;
      margin-bottom: 3.5rem; display: inline-block;
    }
    .volver:hover { color: var(--tinta); }

    .post-titulo {
      font-size: 30px; color: var(--tinta); line-height: 1.3;
      text-align: center; margin-bottom: 0.8rem; font-weight: 700;
      letter-spacing: 0.01em;
    }
    .post-sub {
      font-size: 14px; color: var(--tinta-suave); font-style: italic;
      text-align: center; margin-bottom: 3.5rem;
    }

    .ornamento {
      text-align: center; color: var(--tinta-tenue);
      font-size: 14px; letter-spacing: 0.5em; margin-bottom: 3rem;
    }

    .post-cuerpo { font-size: 17px; color: var(--tinta); }
    .post-cuerpo p { margin-bottom: 1.7rem; text-align: left; }
    .post-cuerpo p:last-child { margin-bottom: 0; }

    .post-cuerpo p.nota {
      font-size: 13.5px; font-style: italic; color: var(--tinta-suave);
      line-height: 1.7; margin-bottom: 0.8rem;
    }
    .notas-sep {
      width: 60px; height: 1px; background: var(--linea);
      margin: 2.5rem 0 1.8rem;
    }

    .leido-zona {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 4rem; padding-top: 2.5rem; border-top: 1px solid var(--linea);
      position: relative;
    }

    /* ===== GLOBITO DE GRACIAS (estética burbuja WhatsApp) ===== */
    .gracias-pop {
      position: absolute;
      top: 0.6rem;                 /* justo encima del ojo */
      left: 50%;
      transform: translate(-50%, 0);
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: #dcf8c6;         /* verde burbuja WhatsApp saliente */
      color: #3a5a3f;
      font-family: 'Libre Baskerville', serif;
      font-size: 12px; letter-spacing: 0.06em;
      padding: 0.5rem 0.85rem;
      border-radius: 14px 14px 14px 4px;   /* colita tipo burbuja */
      box-shadow: 0 4px 14px rgba(0,0,0,0.10);
      opacity: 0;                  /* oculto por defecto */
      pointer-events: none;
      white-space: nowrap;
    }
    /* aparición y desvanecimiento QUIETOS (solo opacidad, sin desplazamiento) */
    .gracias-pop.mostrar { animation: graciasFade 4s ease forwards; }

    @keyframes graciasFade {
      0%   { opacity: 0; }
      12%  { opacity: 1; }   /* aparece suave (~0.5s) */
      80%  { opacity: 1; }   /* se queda quieto */
      100% { opacity: 0; }   /* se desvanece suave */
    }

    .gracias-corazon { width: 14px; height: 14px; display: block; }
    .gracias-corazon path { fill: #4caf50; }   /* corazón verde */
    .ojo-btn {
      display: inline-flex; flex-direction: column; align-items: center; gap: 0.6rem;
      background: none; border: none; cursor: pointer; user-select: none;
      font-family: 'Libre Baskerville', serif;
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--tinta-suave); transition: color 0.4s ease; padding: 0.4rem;
    }
    .ojo-btn:hover { color: var(--tinta); }
    .ojo-btn.confirmado { color: #3f7a52; cursor: default; }

    .ojo-icon { width: 26px; height: 26px; display: block; }
    .ojo-icon path, .ojo-icon circle {
      fill: none; stroke: var(--tinta-suave); stroke-width: 1.4;
      transition: stroke 0.4s ease, fill 0.4s ease;
    }
    .ojo-btn:hover .ojo-icon path, .ojo-btn:hover .ojo-icon circle { stroke: var(--tinta); }
    .ojo-btn.confirmado .ojo-icon path { stroke: #3f7a52; }
    .ojo-btn.confirmado .ojo-icon circle { stroke: #3f7a52; fill: #3f7a52; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

      </button>

  </div>
</div>

function claveLeido(id) { return 'blog-leido-' + id; }
function estaLeido(id) {
  try { return localStorage.getItem(claveLeido(id)) === '1'; } catch (e) { return false; }
}
function marcarLocal(id) {
  try { localStorage.setItem(claveLeido(id), '1'); } catch (e) {}
}
function sumarLeido(id) {
  if (!sbClient) return;
  try {
    sbClient.from('lecturas').insert({ post_id: id }).then(function(){}).catch(function(){});
  } catch (e) {}
}

/* Muestra el globito "gracias" ~4s y lo desvanece, sin moverse */
function mostrarGracias() {
  var pop = document.getElementById('gracias-pop');
  if (!pop) return;
  pop.classList.remove('mostrar');
  void pop.offsetWidth;          /* reinicia la animación si se repite */
  pop.classList.add('mostrar');
  setTimeout(function () { pop.classList.remove('mostrar'); }, 4100);
}

function renderLista() {
  var cont = document.getElementById('lista');
  cont.innerHTML = '';
  if (!posts.length) {
    cont.innerHTML = '<div class="vacio">Aún no hay textos publicados.</div>';
    return;
  }
  posts.forEach(function (p) {
    var item = document.createElement('div');
    item.className = 'post-item';
    var tit = document.createElement('div');
    tit.className = 'post-item-titulo';
    tit.textContent = p.titulo;
    item.appendChild(tit);
    if (p.subtitulo) {
      var sub = document.createElement('div');
      sub.className = 'post-item-sub';
      sub.textContent = p.subtitulo;
      item.appendChild(sub);
    }
    item.addEventListener('click', function () { abrirPost(p); });
    cont.appendChild(item);
  });
}

function abrirPost(p) {
  document.getElementById('post-titulo').textContent = p.titulo;
  var subEl = document.getElementById('post-sub');
  if (p.subtitulo) { subEl.textContent = p.subtitulo; subEl.style.display = ''; }
  else { subEl.style.display = 'none'; }

  var cont = document.getElementById('post-cuerpo');
  cont.innerHTML = '';
  var notasEmpezaron = false;
  p.cuerpo.split('\n\n').forEach(function (bloque) {
    if (bloque.replace(/\s/g, '') === '') return;
    var esNota = /^\s*\*/.test(bloque);
    if (esNota && !notasEmpezaron) {
      var sep = document.createElement('div');
      sep.className = 'notas-sep';
      cont.appendChild(sep);
      notasEmpezaron = true;
    }
    var par = document.createElement('p');
    if (esNota) par.className = 'nota';
    bloque.split('\n').forEach(function (linea, i) {
      if (i > 0) par.appendChild(document.createElement('br'));
      par.appendChild(document.createTextNode(linea));
    });
    cont.appendChild(par);
  });

  var btn = document.getElementById('ojo-btn');
  var label = document.getElementById('ojo-label');
  btn.classList.toggle('confirmado', estaLeido(p.id));
  label.textContent = 'leído';

  btn.onclick = function () {
    if (estaLeido(p.id)) return;
    marcarLocal(p.id);
    btn.classList.add('confirmado');
    sumarLeido(p.id);
    mostrarGracias();
  };

  document.getElementById('lista').classList.add('oculto');
  document.querySelector('.blog-titulo').style.display = 'none';
  document.getElementById('post-vista').classList.add('activo');
  window.scrollTo(0, 0);
}

document.getElementById('volver').addEventListener('click', function () {
  document.getElementById('post-vista').classList.remove('activo');
  document.getElementById('lista').classList.remove('oculto');
  document.querySelector('.blog-titulo').style.display = '';
  window.scrollTo(0, 0);
});

renderLista();
</script>

</body>
